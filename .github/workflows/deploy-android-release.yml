name: Release Android to Google Play

# Ship an Android release by tagging the commit that carries it — the same tag
# that ships iOS:
#
#   git tag v1.9.26 && git push origin v1.9.26
#
# This never builds or uploads a binary. `Deploy Android to Play Store (Alpha)`
# already built this commit's bundle when it landed on `main` and put it on the
# alpha track; this workflow promotes that exact bundle to production and sets
# its What's New from my_app/fastlane/metadata/android/en-GB/changelogs/default.txt.
#
# The bundle is found by *version code* — pubspec's `+<buildNumber>`, which the
# alpha upload stamped into the bundle. Every `my_app/` commit bumps it, so the
# code names this release and nothing else. That is why the version bump
# CLAUDE.md requires is load-bearing here too: skip it and the tag promotes
# whatever bundle last carried that number.
#
# The alpha track only ever holds the most recent upload. If a newer `my_app/`
# commit reached `main` after the tagged one, its bundle has replaced the tagged
# one on alpha and this workflow will time out waiting — tag the newer version
# instead, or promote by hand in Play Console.
#
# Unlike iOS, nothing is left for the web UI: once Google's own review of the
# update passes, the release is live for every customer.
#
# Required repository secret:
#   PLAY_STORE_SERVICE_ACCOUNT_JSON - the Play service account the alpha upload
#     already uses. It needs release management on the production track.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote to production (off = validate the promotion and change nothing)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Waits up to 30 min for the alpha upload of this commit to land, then
    # promotes. Leave headroom.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: my_app

    steps:
      - uses: actions/checkout@v4
        with:
          # Need main's history to check the tagged commit is actually on it.
          fetch-depth: 0

      # The tag says which release to ship; pubspec says which bundle that is.
      # If they disagree we'd promote the wrong build, so stop here.
      - name: Check the tag matches pubspec and the commit is on main
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+[0-9]*$/\1/p' pubspec.yaml)"
          version_code="$(sed -n 's/^version: [0-9.]*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          if [ -z "$version" ] || [ -z "$version_code" ]; then
            echo "::error::Could not parse 'version:' from my_app/pubspec.yaml"
            exit 1
          fi
          echo "pubspec version: $version (build $version_code)"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match my_app/pubspec.yaml ($version). Tag the commit that actually ships this version."
              exit 1
            fi
          fi

          # Compare against FETCH_HEAD rather than origin/main: on a tag-triggered
          # checkout there is no guarantee a remote-tracking branch ref exists.
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on main. The alpha upload only builds main, so no bundle exists for this commit."
            exit 1
          fi

          echo "Shipping $version — promoting build $version_code from alpha to production" >> "$GITHUB_STEP_SUMMARY"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Tooling (fastlane)
        run: gem install fastlane --no-document

      - name: Promote the alpha build to production
        env:
          PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          # Tag pushes go live. A manual run defaults to a dry run, which
          # validates the promotion with Google and commits nothing.
          PROMOTE: ${{ (github.event_name == 'push' || inputs.promote) && '1' || '0' }}
        run: cd fastlane && fastlane android promote_to_production
