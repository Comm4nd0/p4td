name: Store Screenshots

# Generate plain App Store + Play Store screenshots and upload them — no local
# Mac required. Manually triggered. (Screenshots are uploaded as-is, without
# device frames or burned-in captions; frameit has no bezels for the captured
# emulator/simulator resolutions, so framing is intentionally not used.)
#
# Required repository secrets:
#   DEMO_EMAIL, DEMO_PASSWORD                     - the seeded demo owner account
#   PLAY_STORE_SERVICE_ACCOUNT_JSON               - Play upload (already used by deploy)
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8         - App Store Connect API key (.p8 contents)
#
# Run `python manage.py seed_demo_data ...` against the backend first so the demo
# account has a dog + media (see my_app/SCREENSHOTS.md).

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to generate"
        type: choice
        options: ["both", "ios", "android"]
        default: "both"
      upload:
        description: "Upload to the stores (otherwise artifacts only)"
        type: boolean
        default: true
      screenshots_run_id:
        description: "Reuse the ios-screenshots artifact from this run id (skips iOS capture — for retrying just the upload)"
        type: string
        default: ""
      demo_dog:
        description: "Name of the dog on the demo account to screenshot (the harness refuses any other dog)"
        type: string
        default: "Luna"

# Least privilege: the GITHUB_TOKEN this workflow gets can only read the
# repository. Nothing here pushes, comments or publishes with it.
permissions:
  contents: read
  # download-artifact with a run-id reads another run's artifacts.
  actions: read

env:
  LOCALE: en-GB
  DEMO_DOG: ${{ inputs.demo_dog }}

jobs:
  ios:
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: my_app
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the pinned Flutter version
        if: ${{ inputs.screenshots_run_id == '' }}
        id: flutter_pin
        run: echo "version=$(cat "$GITHUB_WORKSPACE/my_app/.flutter-version")" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: ${{ inputs.screenshots_run_id == '' }}
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
      - name: Tooling (fastlane + coreutils for gtimeout)
        run: |
          brew install coreutils || true
          gem install fastlane -v 2.241.2 --no-document
      - name: Install dependencies
        if: ${{ inputs.screenshots_run_id == '' }}
        run: flutter pub get
      - name: Provide GoogleService-Info.plist (Firebase build input)
        if: ${{ inputs.screenshots_run_id == '' }}
        # Screenshots never initialise Firebase, so a stub satisfies the Xcode
        # build. If you add the real plist as a secret, it's used instead.
        env:
          GS_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GS_PLIST" ]; then
            printf '%s' "$GS_PLIST" > ios/Runner/GoogleService-Info.plist
          else
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0"><dict>'
              echo '<key>API_KEY</key><string>stub</string>'
              echo '<key>GCM_SENDER_ID</key><string>000000000000</string>'
              echo '<key>BUNDLE_ID</key><string>uk.co.paws4thoughtdogs.paws4thoughtdogs</string>'
              echo '<key>PROJECT_ID</key><string>stub</string>'
              echo '<key>STORAGE_BUCKET</key><string>stub.appspot.com</string>'
              echo '<key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>'
              echo '<key>IS_GCM_ENABLED</key><false/>'
              echo '</dict></plist>'
            } > ios/Runner/GoogleService-Info.plist
          fi
      - name: Reuse screenshots from a previous run
        if: ${{ inputs.screenshots_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-screenshots
          path: my_app/fastlane/screenshots
          run-id: ${{ inputs.screenshots_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot iPhone simulator (maintained action — reliable full boot)
        if: ${{ inputs.screenshots_run_id == '' }}
        uses: futureware-tech/simulator-action@bfa03d93ec9de6dacb0c5553bbf8da8afc6c2ee9 # v3
        with:
          model: "iPhone 17 Pro Max"
      - name: Boot iPad simulator
        if: ${{ inputs.screenshots_run_id == '' }}
        # Multiple simulators can be booted at once; the capture script targets
        # each by name. The iPad set also serves as the Mac App Store listing
        # ("iPad app on Apple silicon Macs" shows the iPad screenshots).
        uses: futureware-tech/simulator-action@bfa03d93ec9de6dacb0c5553bbf8da8afc6c2ee9 # v3
        with:
          model: "iPad Pro 13-inch (M5)"
      - name: Capture iOS screenshots
        if: ${{ inputs.screenshots_run_id == '' }}
        timeout-minutes: 75
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          # The simulator-action step above already booted the device, so the
          # script must not try to boot/poll it again.
          IOS_SKIP_BOOT: "1"
          # Verbose flutter drive output, tee'd to a log we upload even on
          # timeout — so a silent hang still leaves a readable trace.
          SCREENSHOT_VERBOSE: "1"
          # The 6.9" iPhone covers all iPhone sizes; the 13" iPad covers the
          # iPad listing and, via "iPad app on Mac", the Mac App Store too.
          IOS_DEVICES_ENV: |
            iPhone 17 Pro Max
            iPad Pro 13-inch (M5)
        run: |
          mkdir -p build
          set -o pipefail
          # The simulator <-> flutter VM-service handshake is intermittently
          # flaky (can hang on "Waiting for VM Service port"). Cap each attempt
          # with gtimeout and retry once so a single bad handshake isn't fatal.
          # 2100s covers both devices in one attempt (the iPhone drive alone
          # has taken ~15 min on these runners). A retry skips devices that
          # already captured (.complete markers), so it only redoes failures.
          #
          # The demo login is passed to the build as --dart-define, and
          # `flutter drive --verbose` prints the build commands it runs — with
          # the defines in them, plain and base64-encoded (DART_DEFINES=...).
          # GitHub masks the plain secret in this log but not its base64, and
          # masks nothing in an uploaded file; this repository is public, so
          # both the log and the artifact are downloadable by anyone signed
          # in. Every line that carries a define, the password, the email or
          # their encodings is dropped before it reaches either.
          b64() { printf '%s' "$1" | base64 | tr -d '\n'; }
          scrub() {
            # No login set: the script stops with its own error; let it through
            # (an empty pattern would match, and so drop, every line).
            if [ -z "${DEMO_PASSWORD:-}" ] || [ -z "${DEMO_EMAIL:-}" ]; then cat; return; fi
            grep --line-buffered -viE 'dart[-_]defines?' \
              | grep --line-buffered -vF \
                  -e "$DEMO_PASSWORD" -e "$DEMO_EMAIL" \
                  -e "$(b64 "$DEMO_PASSWORD")" -e "$(b64 "$DEMO_EMAIL")" \
                  -e "$(b64 "DEMO_PASSWORD=$DEMO_PASSWORD")" -e "$(b64 "DEMO_EMAIL=$DEMO_EMAIL")" \
              || true
          }
          attempt() { gtimeout 2100 ./tool/screenshots.sh ios 2>&1 | scrub | tee -a build/ios-drive.log; }
          attempt || { echo "SS> iOS capture attempt 1 failed/timed out — retrying once"; attempt; }
      - name: Upload iOS drive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-drive-log
          path: my_app/build/ios-drive.log
          if-no-files-found: ignore
      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p fastlane/keys
          printf '%s' "$ASC_KEY_P8" > fastlane/keys/asc.p8
          export ASC_KEY_PATH="$PWD/fastlane/keys/asc.p8"
          (cd fastlane && fastlane ios upload_ios)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: my_app/fastlane/screenshots/

  android:
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: my_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve the pinned Flutter version
        id: flutter_pin
        run: echo "version=$(cat "$GITHUB_WORKSPACE/my_app/.flutter-version")" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
      - name: Tooling (fastlane)
        run: gem install fastlane -v 2.241.2 --no-document
      - name: Install dependencies
        run: flutter pub get
      - name: Create google-services.json (required by Gradle google-services plugin)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Capture Android screenshots (phone)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          # Where the host-side flutter_driver writes the captured PNGs. This
          # MUST be a step-level env var, not an `export` inside `script:` — the
          # emulator-runner action runs each script line in its own `sh -c`, so
          # an export wouldn't survive to the `flutter drive` line (the driver
          # would fall back to build/screenshots/raw and the copy below misses).
          SCREENSHOT_OUT: build/screenshots/android-phone
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          working-directory: my_app
          # Emulator is already running here (device "emulator-5554").
          # NOTE: keep each command on one line — the action's shell does not
          # handle backslash line-continuations.
          script: |
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554 --dart-define=DEMO_EMAIL="$DEMO_EMAIL" --dart-define=DEMO_PASSWORD="$DEMO_PASSWORD" --dart-define=DEMO_DOG="${DEMO_DOG:-Luna}"
            mkdir -p "fastlane/metadata/android/${LOCALE:-en-GB}/images/phoneScreenshots"
            cp build/screenshots/android-phone/*.png "fastlane/metadata/android/${LOCALE:-en-GB}/images/phoneScreenshots/" || true
      - name: Upload to Play Console
        if: ${{ inputs.upload }}
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > fastlane/play.json
          export SUPPLY_JSON_KEY="$PWD/fastlane/play.json"
          (cd fastlane && fastlane android upload_android)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: my_app/fastlane/metadata/android/
