name: Xcode Cloud Diagnose

# Read-only diagnostic. The Xcode Cloud UI reports a distribution failure as
# a bare "Preparing build for App Store Connect failed" and keeps the real
# reason in the build's issue list; this pulls that list through the App
# Store Connect API (products -> latest build runs -> actions -> issues) and
# prints the errors in the job log. Uses the same ASC API key as the store
# workflows. Never changes anything on Apple's side.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many recent builds to list per product"
        default: "3"
      mine:
        description: "How many of the newest failures to pull log bundles for"
        default: "1"

# Least privilege: the GITHUB_TOKEN this workflow gets can only read the
# repository. Nothing here pushes, comments or publishes with it.
permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PyJWT
        run: pip install --quiet pyjwt==2.15.1 cryptography==50.0.2

      - name: Pull the latest Xcode Cloud build issues
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          RUNS: ${{ inputs.runs || '3' }}
          MINE: ${{ inputs.mine || '1' }}
        run: python3 scripts/xcode_cloud_diagnose.py
