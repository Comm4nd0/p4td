name: Deploy Android to Play Store (Alpha)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'my_app/**'

# Least privilege: the GITHUB_TOKEN this workflow gets can only read the
# repository. Nothing here pushes, comments or publishes with it.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my_app

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve the pinned Flutter version
        id: flutter_pin
        run: echo "version=$(cat "$GITHUB_WORKSPACE/my_app/.flutter-version")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter_pin.outputs.version }}

      # Secrets reach the shell as environment variables, never pasted into
      # the script text: interpolated there, a quote or a `$` in a value
      # changes what the shell runs.
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s\n' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" > android/key.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> android/key.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> android/key.properties
          echo "storeFile=../keystore/upload-keystore.jks" >> android/key.properties

      - name: Install dependencies
        run: flutter pub get

      # Lint is informational: report issues but don't block the release on
      # style warnings/infos. Real compile errors still fail (errors are always
      # fatal), and `flutter test` below remains a hard gate.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: uk.co.paws4thoughtdogs.app
          releaseFiles: my_app/build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
