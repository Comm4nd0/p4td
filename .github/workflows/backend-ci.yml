name: Backend CI

# Run the Django checks, migration check, and test suite against a real
# PostgreSQL 15 (matching production) on every push/PR that touches the backend.
on:
  push:
    paths:
      - 'api/**'
      - 'p4td_backend/**'
      - 'website/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-ci.yml'
      # A green run here is what triggers Deploy Backend, so anything that can
      # change what runs in production has to be covered — otherwise an
      # infra-only change would silently never deploy.
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.prod.yml'
      - 'deploy.sh'
      # deploy.sh runs these on the server (crontab, backups).
      - 'scripts/install-cron.sh'
      - 'scripts/run-cron.sh'
      - 'scripts/backup-db.sh'
  pull_request:
    paths:
      - 'api/**'
      - 'p4td_backend/**'
      - 'website/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-ci.yml'
      # A green run here is what triggers Deploy Backend, so anything that can
      # change what runs in production has to be covered — otherwise an
      # infra-only change would silently never deploy.
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.prod.yml'
      - 'deploy.sh'
      # deploy.sh runs these on the server (crontab, backups).
      - 'scripts/install-cron.sh'
      - 'scripts/run-cron.sh'
      - 'scripts/backup-db.sh'

# Least privilege: the GITHUB_TOKEN this workflow gets can only read the
# repository. Nothing here pushes, comments or publishes with it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: p4td
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until Postgres is ready before the job steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: 'true'
      # Setting RDS_* switches settings.py onto the PostgreSQL backend, pointed
      # at the postgres service above (reachable on localhost from the runner).
      RDS_DB_NAME: p4td
      RDS_USERNAME: postgres
      RDS_PASSWORD: postgres
      RDS_HOSTNAME: localhost
      RDS_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # requirements-prod.txt is the consolidated install source (it pulls in
        # requirements.txt), so this installs everything dev + prod needs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      # DJANGO_DEBUG=true above means the `if not DEBUG:` production security
      # block in settings.py is never exercised by the suite. Deploy-config
      # mistakes in it would otherwise only surface in production.
      - name: Django deployment check
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-for-check-deploy
          DJANGO_ALLOWED_HOSTS: example.com

      - name: Run tests
        # --parallel splits across the runner's cores; the suite is ~600 tests
        # and takes about 17 minutes serially.
        run: python manage.py test --parallel auto

  # Dependency vulnerability scan. BLOCKING: a known-vulnerable pin fails
  # Backend CI, and so stops the deploy that a green run would trigger.
  #
  # It used to be advisory (continue-on-error), which is how djoser sat on a
  # version with a published CVE with nothing saying so. The cost is that a
  # newly disclosed advisory can stop an unrelated deploy. When that happens
  # and the fix cannot ship first, name the advisory explicitly — add
  # `--ignore-vuln <ID>` to the command below with a comment saying why and
  # until when — rather than switching the whole job back to advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit dependencies
        run: pip-audit -r requirements-prod.txt --desc

  # The Dockerfile and compose files are not covered by any other job, so a
  # break in them currently surfaces for the first time as a failed production
  # deploy. Building here is the cheapest way to catch that.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t p4td:ci .
      - name: Validate compose files
        run: |
          # docker-compose.prod.yml declares `env_file: .env`, which is
          # gitignored and so absent on a fresh checkout. Compose treats a
          # missing env_file as a hard error, so validation failed here
          # regardless of whether the compose file was actually valid. An empty
          # placeholder is enough for `config` to parse; the inline
          # RDS_PASSWORD below already supplies the one value it interpolates.
          touch .env
          docker compose -f docker-compose.yml config -q
          RDS_PASSWORD=ci docker compose -f docker-compose.prod.yml config -q
